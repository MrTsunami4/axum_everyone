[package]
name = "axum_everyone"
version = "0.1.0"
edition = "2024"
default-run = "axum_everyone"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["macros"] }
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toasty = { version = "0.11.0", features = ["sqlite", "jiff", "serde", "migration"] }
toasty-cli = "0.11.0"
tokio = { version = "1.53.2", features = [
    "macros",
    "rt-multi-thread",
    "signal",
] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["axum_extras", "jiff_0_2"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
